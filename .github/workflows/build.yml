name: build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Pack module zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zipper"
          cat > "$RUNNER_TEMP/zipper/go.mod" <<'EOF'
          module example.com/zipper

          go 1.21
          EOF
          cat > "$RUNNER_TEMP/zipper/main.go" <<'EOF'
          package main

          import (
              "fmt"
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              if len(os.Args) != 5 {
                  log.Fatalf("usage: %s <module-path> <version> <src-dir> <out-zip>", os.Args[0])
              }
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
              fmt.Println("created", os.Args[4])
          }
          EOF
          cd "$RUNNER_TEMP/zipper"
          go get golang.org/x/mod@v0.14.0
          mkdir -p "$RUNNER_TEMP/build_output"
          # this pack workflow is Seal build plumbing, not part of the published module
          rm "$GITHUB_WORKSPACE/src/.github/workflows/build.yml"
          go run . github.com/Masterminds/goutils v1.1.0 "$GITHUB_WORKSPACE/src" "$RUNNER_TEMP/build_output/v1.1.0.zip"
          unzip -l "$RUNNER_TEMP/build_output/v1.1.0.zip"

      - name: Build
        shell: bash
        working-directory: src
        env:
          GO111MODULE: 'off'
        run: |
          set -euo pipefail
          go build -v .

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: v1.1.0.zip
          path: ${{ runner.temp }}/build_output/v1.1.0.zip
          if-no-files-found: error
